<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FB Ad Video Downloader</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #141821;
    --panel-2: #1b2130;
    --line: #262d3d;
    --text: #e8ecf5;
    --muted: #8b95ab;
    --accent: #4a8cff;
    --accent-2: #22c993;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 48px 20px 80px;
    background: radial-gradient(1200px 600px at 50% -200px, #17203a 0%, var(--bg) 60%);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 780px; margin: 0 auto; }
  h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  form {
    display: flex; gap: 10px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.35);
  }
  input {
    flex: 1; background: transparent; border: 0; outline: 0; color: var(--text);
    font-size: 15px; padding: 12px 14px; min-width: 0;
  }
  input::placeholder { color: #5c667e; }
  button {
    border: 0; border-radius: 10px; padding: 12px 20px; font-size: 15px; font-weight: 600;
    color: #fff; background: var(--accent); cursor: pointer; white-space: nowrap;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: .55; cursor: default; filter: none; }
  .hint { color: var(--muted); font-size: 13px; margin: 12px 2px 0; }
  .status { margin-top: 24px; padding: 14px 16px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
  .status.err { border-color: #4a2530; color: var(--danger); background: #1b1013; }
  .meta { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 8px 16px; color: var(--muted); font-size: 13px; }
  .meta b { color: var(--text); font-weight: 600; }
  .card {
    margin-top: 16px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; overflow: hidden;
  }
  video { width: 100%; display: block; background: #000; max-height: 460px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; padding: 14px; align-items: center; }
  .actions .spacer { flex: 1; }
  a.dl {
    display: inline-block; text-decoration: none; border-radius: 10px; padding: 10px 16px;
    font-weight: 600; font-size: 14px; color: #04120c; background: var(--accent-2);
  }
  a.dl.sd { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); }
  a.dl:hover { filter: brightness(1.08); }
  .copy {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--muted);
    font-weight: 500; font-size: 13px; padding: 10px 14px;
  }
  .idx { padding: 12px 14px 0; color: var(--muted); font-size: 13px; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.3);
    border-top-color: #fff; border-radius: 50%; animation: sp .7s linear infinite; vertical-align: -2px; }
  @keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Facebook Ad Video Downloader</h1>
  <p class="sub">Paste an Ads Library link — get the creative as an .mp4.</p>

  <form id="form">
    <input id="url" type="text" autocomplete="off" spellcheck="false"
           placeholder="https://www.facebook.com/ads/library/?id=1703936547635791">
    <button id="go" type="submit">Fetch video</button>
  </form>
  <p class="hint">Also accepts a bare ad ID, or a direct <code>fbcdn.net</code> .mp4 link.</p>

  <div id="out"></div>
</div>

<script>
const form = document.getElementById('form');
const input = document.getElementById('url');
const go = document.getElementById('go');
const out = document.getElementById('out');

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const streamUrl = (u, name, inline) =>
  `/api/stream?u=${encodeURIComponent(u)}&name=${encodeURIComponent(name)}${inline ? '&inline=1' : ''}`;

function show(html, isError) {
  out.innerHTML = `<div class="status${isError ? ' err' : ''}">${html}</div>`;
}

function render(ad) {
  const bits = [];
  if (ad.pageName) bits.push(`<span>Advertiser <b>${esc(ad.pageName)}</b></span>`);
  if (ad.adId) bits.push(`<span>Ad ID <b>${esc(ad.adId)}</b></span>`);
  bits.push(`<span><b>${ad.videos.length}</b> video${ad.videos.length === 1 ? '' : 's'}</span>`);

  const cards = ad.videos.map((v, i) => {
    const best = v.downloads[0];
    const preview = best ? streamUrl(best.url, best.filename, true) : '';
    const poster = v.poster ? streamUrl(v.poster, 'poster.jpg', true) : '';
    const buttons = v.downloads.map((d) =>
      `<a class="dl ${d.quality}" href="${esc(streamUrl(d.url, d.filename))}" download="${esc(d.filename)}">
         Download ${d.quality.toUpperCase()}
       </a>`).join('');
    return `
      <div class="card">
        ${ad.videos.length > 1 ? `<div class="idx">Creative ${i + 1} of ${ad.videos.length}</div>` : ''}
        <video controls preload="metadata" ${poster ? `poster="${esc(poster)}"` : ''} src="${esc(preview)}"></video>
        <div class="actions">
          ${buttons}
          <span class="spacer"></span>
          <button class="copy" data-link="${esc(best ? best.url : '')}">Copy direct link</button>
        </div>
      </div>`;
  }).join('');

  out.innerHTML = `<div class="meta">${bits.join('')}</div>${cards}`;

  out.querySelectorAll('.copy').forEach((btn) => {
    btn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(btn.dataset.link);
        btn.textContent = 'Copied';
        setTimeout(() => { btn.textContent = 'Copy direct link'; }, 1500);
      } catch {
        btn.textContent = 'Copy failed';
      }
    });
  });
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const url = input.value.trim();
  if (!url) return;

  go.disabled = true;
  go.innerHTML = '<span class="spin"></span> Fetching';
  show('Reading the ad from Facebook…');

  try {
    const res = await fetch('/api/resolve', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ url }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    if (!data.videos.length) throw new Error('No video in this ad — it looks image-only.');
    render(data);
  } catch (err) {
    show(esc(err.message), true);
  } finally {
    go.disabled = false;
    go.textContent = 'Fetch video';
  }
});

input.focus();
</script>
</body>
</html>
